# Builds the site and publishes it to GitHub Pages on every push to main.
#
# BASE_PATH is the repository name because a project site is served from
# https://<user>.github.io/<repo>/ — without it every asset would 404.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dirección donde se publica
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://$owner.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"

      - run: npm run build:pages
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
      # trailingSlash puts the 404 page at 404/index.html; Pages looks for it at
      # the root, so leave a copy there or a bad URL gets GitHub's generic 404.
      - name: Custom 404 en la raíz
        run: cp out/404/index.html out/404.html


      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
