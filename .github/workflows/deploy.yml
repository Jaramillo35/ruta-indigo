# Builds the site and publishes it to GitHub Pages on every push to main.
#
# El sitio se sirve en migryantravels.com (ver public/CNAME), o sea desde la
# raíz: no lleva BASE_PATH. Si alguna vez vuelve a publicarse bajo
# usuario.github.io/repo, hay que reponerlo o todos los recursos dan 404.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # En dominio propio el sitio vive en la raíz: sin BASE_PATH. El dominio
      # sale de public/CNAME, que es también lo que lee GitHub Pages.
      - name: Dirección donde se publica
        run: echo "SITE_URL=https://$(cat public/CNAME)/" >> "$GITHUB_ENV"

      - run: npm run build:pages
        env:
          STATIC_EXPORT: "1"
      # trailingSlash puts the 404 page at 404/index.html; Pages looks for it at
      # the root, so leave a copy there or a bad URL gets GitHub's generic 404.
      - name: Custom 404 en la raíz
        run: cp out/404/index.html out/404.html


      # Que todo lo que el HTML pide exista en el export. next/image no antepone
      # el basePath en un export sin optimizar, y esa clase de fallo ya rompió
      # las imágenes una vez: aquí revienta la compilación, no el sitio.
      - name: Verificar recursos
        run: node scripts/check-assets.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
